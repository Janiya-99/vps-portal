<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="charmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d55"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Rounded Background -->
  <rect width="64" height="64" rx="16" fill="#050508"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Glowing Charm Red Cybernetic Icon (P + Server Rack) -->
  <g filter="url(#glow)">
    <!-- Server Stack Top -->
    <rect x="14" y="14" width="36" height="10" rx="3" fill="#0d0e15" stroke="url(#charmGrad)" stroke-width="2"/>
    <circle cx="20" cy="19" r="2" fill="#ff2d55"/>
    <circle cx="26" cy="19" r="2" fill="#ff2d55" opacity="0.6"/>
    <line x1="34" y1="19" x2="44" y2="19" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Server Stack Middle -->
    <rect x="14" y="27" width="36" height="10" rx="3" fill="#0d0e15" stroke="url(#charmGrad)" stroke-width="2"/>
    <circle cx="20" cy="32" r="2" fill="#ff2d55"/>
    <circle cx="26" cy="32" r="2" fill="#ff2d55" opacity="0.6"/>
    <line x1="34" y1="32" x2="44" y2="32" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Server Stack Bottom -->
    <rect x="14" y="40" width="36" height="10" rx="3" fill="#0d0e15" stroke="url(#charmGrad)" stroke-width="2"/>
    <circle cx="20" cy="45" r="2" fill="#ff2d55"/>
    <circle cx="26" cy="45" r="2" fill="#ff2d55" opacity="0.6"/>
    <line x1="34" y1="45" x2="44" y2="45" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
